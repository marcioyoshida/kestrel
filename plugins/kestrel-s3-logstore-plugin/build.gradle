plugins {
    id 'groovy'
}

apply from: "../../gradle/java-version.gradle"
ext.pluginClassNames = 'org.rundeck.kestrel.logstore.KestrelS3LogStorePlugin'
ext.pluginName = 'Kestrel S3 Log Store'
ext.pluginDescription = 'Execution logs in S3 with partial (checkpoint) store and retrieve, so any pod can tail a running execution'

configurations {
    pluginLibs
    implementation {
        extendsFrom pluginLibs
    }
}

dependencies {
    implementation project(':core')
    pluginLibs platform("software.amazon.awssdk:bom:${awsSdkV2Version}")
    pluginLibs("software.amazon.awssdk:s3") {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
        exclude group: 'software.amazon.awssdk', module: 'apache5-client'
        exclude group: 'org.slf4j'
    }
    pluginLibs("software.amazon.awssdk:url-connection-client") {
        exclude group: 'org.slf4j'
    }

    testImplementation "org.apache.groovy:groovy-all:${groovyVersion}"
    testImplementation "org.spockframework:spock-core:${spockVersion}"
}

repositories {
    mavenLocal()
    mavenCentral()
}

task copyToLib(type: Copy) {
    into "$buildDir/output/lib"
    from configurations.pluginLibs
}

jar {
    from "$buildDir/output"
    manifest {
        attributes 'Rundeck-Plugin-Classnames': pluginClassNames
        attributes 'Rundeck-Plugin-Name': pluginName
        attributes 'Rundeck-Plugin-Description': pluginDescription
        def libList = configurations.pluginLibs.collect { 'lib/' + it.name }.join(' ')
        attributes 'Rundeck-Plugin-Libs': "${libList}"
    }
}
jar.dependsOn(copyToLib)

test {
    useJUnitPlatform()
}
