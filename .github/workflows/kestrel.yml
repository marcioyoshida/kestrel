# Kestrel CI: validate the Helm chart and the CDK app, build the Kestrel war + container image
# from this fork, and (on main) push it to the KestrelCi ECR repository via GitHub OIDC.
name: Kestrel

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kestrel-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.19.0
  KUBECONFORM_VERSION: v0.7.0
  CDK_VERSION: 2.1145.0

jobs:
  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm and kubeconform (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "$(curl -fsSL https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum | cut -d' ' -f1)  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz" && mv linux-amd64/helm bin/
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "$base/kubeconform-linux-amd64.tar.gz" && curl -fsSLO "$base/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: deploy/helm/kestrel/ci/test.sh

  infra:
    name: CDK synth
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: |
          python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
          npm install -g "aws-cdk@${CDK_VERSION}"
          cdk synth -q -c ephemeral=true && .venv/bin/python check_templates.py cdk.out
          cdk synth -q && .venv/bin/python check_templates.py cdk.out

  trigger:
    name: Trigger (Go)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # OIDC to AWS, used only on pushes to main
    defaults:
      run:
        working-directory: kestrel-trigger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kestrel-trigger/go.mod
          cache-dependency-path: kestrel-trigger/go.sum
      - name: Test and build (amd64 + arm64, static)
        run: |
          go vet ./... && go test ./...
          for a in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags="-s -w" -o bin/kestrel-trigger-linux-$a .
          done
          ls -l bin
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || vars.KESTREL_ECR_ROLE_ARN == ''
        run: docker buildx build --platform linux/amd64,linux/arm64 -t kestrel-trigger:ci .
      - name: AWS credentials (OIDC)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KESTREL_ECR_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.KESTREL_ECR_ROLE_ARN }}
          aws-region: us-east-1
      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KESTREL_ECR_ROLE_ARN != ''
        env:
          REPO: ${{ vars.KESTREL_ECR_REPOSITORY }}-trigger
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "$REPO:${GITHUB_SHA::12}" -t "$REPO:main" .
          echo "Pushed $REPO:${GITHUB_SHA::12} (amd64, arm64)" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build war + image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # OIDC to AWS, used only on pushes to main
    env:
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - name: Free runner disk (the build needs ~25 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the build derives its version and commit from git
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # setup-gradle's wrapper validation scans every jar in the repo and rejects the stale,
      # unpublished examples/json-plugin/wrapper/gradle-wrapper.jar that upstream ships (never run
      # here). Verify the one wrapper this build executes against Gradle's published checksum.
      - name: Verify Gradle wrapper
        run: |
          set -euo pipefail
          v=$(sed -n 's/^distributionUrl=.*gradle-\([0-9.]*\)-bin.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)
          echo "$(curl -fsSL "https://services.gradle.org/distributions/gradle-${v}-wrapper.jar.sha256")  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: false
      # Upstream lockfiles resolve through PagerDuty's private npm mirror (a proxy of npmjs at
      # .../npm/). Point them at the public registry; their integrity hashes still pin every byte.
      - name: Use the public npm registry
        run: |
          git ls-files '*package-lock.json' | xargs sed -i 's#https://npm.artifacts.pd-internal.com/npm/#https://registry.npmjs.org/#g'
          ! git grep -q pd-internal.com -- '*package-lock.json'
      - name: Kestrel unit tests
        run: |
          ./gradlew :kestrel-scheduler:test \
            :rundeckapp:test --tests 'org.rundeck.security.RundeckPreauthenticationRequestHeaderFilterTest'
      - name: Build war and image
        env:
          REPO: ${{ vars.KESTREL_ECR_REPOSITORY || 'kestrel' }}
        run: |
          ./gradlew :rundeckapp:bootWar
          ./gradlew :docker:officialBuild -PdockerRepository="$REPO" \
            -PdockerTags="${GITHUB_SHA::12}" -PjreVersion=openjdk-17-jre-headless
          docker run --rm --entrypoint java "$REPO:${GITHUB_SHA::12}" -version
      - name: AWS credentials (OIDC)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KESTREL_ECR_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.KESTREL_ECR_ROLE_ARN }}
          aws-region: us-east-1
      - name: Push to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KESTREL_ECR_ROLE_ARN != ''
        env:
          REPO: ${{ vars.KESTREL_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker push "$REPO:${GITHUB_SHA::12}"
          docker tag "$REPO:${GITHUB_SHA::12}" "$REPO:main" && docker push "$REPO:main"
          echo "Pushed $REPO:${GITHUB_SHA::12}" >> "$GITHUB_STEP_SUMMARY"
