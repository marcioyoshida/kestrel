# Upstream's API functional suite (functional-test `apiTest`, 63 specs) against the image a Kestrel
# run built, once per storage mode:
#   dynamodb  Kestrel: every domain class in DynamoDB (Local), no RDBMS at all
#   rdbms     upstream's MySQL compose, unchanged: the baseline
# ADR 0004's M2 exit: no test fails on dynamodb that passes on rdbms (the `compare` job).
name: Kestrel API suite

on:
  workflow_run:
    workflows: [Kestrel]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Kestrel run whose image to test (default: the latest successful run on main)"
        required: false

permissions:
  contents: read
  actions: read   # the image artifact of the Kestrel run

concurrency:
  group: kestrel-api-suite
  cancel-in-progress: true

jobs:
  api:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: apiTest (${{ matrix.storage }} ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        storage: [dynamodb, rdbms]
        shard: [1, 2, 3, 4]
    steps:
      - name: Kestrel run to test
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          id=${RUN_ID:-$(gh run list -R "$GITHUB_REPOSITORY" -w Kestrel -b main -s success -L 1 --json databaseId -q '.[0].databaseId')}
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json headSha -q .headSha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kestrel-image
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Load the image
        run: gunzip -c kestrel-image.tar.gz | docker load && rm kestrel-image.tar.gz
      # Docker Hub rate-limits anonymous pulls per runner IP; see kestrel.yml.
      - name: Pull Docker Hub images through mirror.gcr.io
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Gradle wrapper
        run: |
          set -euo pipefail
          v=$(sed -n 's/^distributionUrl=.*gradle-\([0-9.]*\)-bin.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)
          echo "$(curl -fsSL "https://services.gradle.org/distributions/gradle-${v}-wrapper.jar.sha256")  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: false
      - name: Compose for ${{ matrix.storage }}
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --user pyyaml
          python3 scripts/kestrel/api_suite_compose.py \
            functional-test/src/test/resources/docker/compose/oss/docker-compose.yml ${{ matrix.storage }}
      - name: apiTest
        env:
          TEST_IMAGE: kestrel:ci
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          grep -rl '@APITest' functional-test/src/test/groovy | sort | awk -v s="$SHARD" 'NR % 4 == s % 4' > shard.txt
          echo "$(wc -l < shard.txt) specs in this shard"
          ./gradlew :functional-test:apiTest -PtestFiles="$(cat shard.txt)" --continue
      - name: Results
        if: always()
        run: |
          python3 - <<'PY' ${{ matrix.storage }} ${{ matrix.shard }} >> "$GITHUB_STEP_SUMMARY"
          import glob, json, sys, xml.etree.ElementTree as E
          storage, shard = sys.argv[1], sys.argv[2]
          out = {}
          for f in glob.glob('functional-test/build/test-results/apiTest/*.xml'):
              for tc in E.parse(f).getroot().iter('testcase'):
                  st = 'failed' if tc.find('failure') is not None or tc.find('error') is not None else \
                       'skipped' if tc.find('skipped') is not None else 'passed'
                  out[f"{tc.get('classname')} > {tc.get('name')}"] = st
          json.dump(out, open(f'api-{storage}-{shard}.json', 'w'), indent=1, sort_keys=True)
          n = {s: sum(v == s for v in out.values()) for s in ('passed', 'failed', 'skipped')}
          print(f"### {storage} shard {shard}: {n['passed']} passed, {n['failed']} failed, {n['skipped']} skipped")
          for k, v in sorted(out.items()):
              if v == 'failed':
                  print(f"- {k}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-${{ matrix.storage }}-${{ matrix.shard }}
          path: |
            api-*.json
            functional-test/build/reports/tests/apiTest/
          retention-days: 14

  compare:
    name: dynamodb vs rdbms
    needs: api
    if: always() && needs.api.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: api-*
          merge-multiple: true
      - name: No test fails on dynamodb that passes on rdbms
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, sys
          res = {'dynamodb': {}, 'rdbms': {}}
          for f in glob.glob('api-*.json'):
              res[f.split('-')[1]].update(json.load(open(f)))
          d, r = res['dynamodb'], res['rdbms']
          regress = sorted(k for k, v in d.items() if v == 'failed' and r.get(k) == 'passed')
          missing = sorted(k for k, v in r.items() if v == 'passed' and k not in d)
          both = sorted(k for k, v in d.items() if v == 'failed' and r.get(k) == 'failed')
          count = lambda m, s: sum(v == s for v in m.values())
          print(f"### API suite: dynamodb {count(d, 'passed')} passed / {count(d, 'failed')} failed; "
                f"rdbms {count(r, 'passed')} passed / {count(r, 'failed')} failed")
          print(f"**Regressions on dynamodb (pass on rdbms): {len(regress)}**")
          for k in regress: print(f"- {k}")
          if missing:
              print(f"**Passed on rdbms, did not run on dynamodb: {len(missing)}**")
              for k in missing: print(f"- {k}")
          print(f"Failing on both (environment, not storage): {len(both)}")
          for k in both: print(f"- {k}")
          sys.exit(1 if regress or missing or not d or not r else 0)
          PY
