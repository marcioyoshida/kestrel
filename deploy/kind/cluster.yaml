# kind cluster for Kestrel (scripts/kestrel/kind_up.sh). Kubernetes 1.36, as on the EKS reference
# environment. The host reaches the web Service on :4440 and DynamoDB Local on :8000.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kestrel
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      - { containerPort: 30440, hostPort: 4440, listenAddress: "127.0.0.1" }   # Kestrel web
      - { containerPort: 30800, hostPort: 8000, listenAddress: "127.0.0.1" }   # DynamoDB Local
