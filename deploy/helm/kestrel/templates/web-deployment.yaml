{{- include "kestrel.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kestrel.fullname" . }}-web
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
    {{- include "kestrel.web.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  # Quartz mode: never run two schedulers at once, even during a rollout.
  strategy:
    {{- if eq .Values.scheduler.mode "quartz" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    {{- end }}
  selector:
    matchLabels:
      {{- include "kestrel.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kestrel.web.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/web-configmap.yaml") . | sha256sum }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kestrel.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000      # `rundeck` user in rundeck/ubuntu-base (gid 0)
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      {{- if .Values.plugins }}
      initContainers:
        - name: fetch-plugins
          image: {{ .Values.pluginFetcher.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- range .Values.plugins }}
              curl -fsSL --proto '=https' -o /libext/{{ .name }} {{ .url | quote }}
              echo "{{ .sha256 }}  /libext/{{ .name }}" | sha256sum -c -
              {{- end }}
          volumeMounts:
            - { name: libext, mountPath: /libext }
      {{- end }}
      containers:
        - name: web
          image: {{ include "kestrel.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - name: http
              containerPort: 4440
          envFrom:
            - configMapRef:
                name: {{ include "kestrel.fullname" . }}-web-env
          env:
            {{- with .Values.database.existingSecret }}
            - name: RUNDECK_DATABASE_USERNAME
              valueFrom: { secretKeyRef: { name: {{ . }}, key: username } }
            - name: RUNDECK_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ . }}, key: password } }
            {{- end }}
            {{- with .Values.keyStorage.existingSecret }}
            - name: RUNDECK_STORAGE_CONVERTER_1_CONFIG_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ . }}, key: password } }
            - name: RUNDECK_CONFIG_STORAGE_CONVERTER_1_CONFIG_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ . }}, key: password } }
            {{- end }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Grails boot + migrations can take minutes; liveness only starts after startup passes.
          startupProbe:
            httpGet: { path: /monitoring/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /monitoring/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /monitoring/health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /home/rundeck/server/data }
            - { name: logs, mountPath: /home/rundeck/var/logs }
            {{- if .Values.plugins }}
            - { name: libext, mountPath: /home/rundeck/libext }
            {{- end }}
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        {{- if .Values.plugins }}
        - name: libext
          emptyDir: {}
        {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
