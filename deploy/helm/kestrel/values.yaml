# Kestrel Helm values — M0 (see docs/kestrel/adr/0001-eks-native-architecture.md).
# M0 runs the upstream image against RDS with Quartz still inside the web pod.

image:
  repository: rundeck/rundeck
  tag: "6.2.1"       # latest upstream GA at fork time; pin a digest in real environments
  digest: ""         # e.g. sha256:...; wins over tag when set
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Public URL users reach through CloudFront, e.g. https://kestrel.example.com
publicUrl: ""

scheduler:
  # quartz = upstream in-JVM scheduler, one web replica (M0).
  # kubernetes = no Quartz cron: a leader web pod converges one CronJob per distinct schedule;
  # each firing goes to an SQS FIFO queue and a runner pod executes it, exactly once per job and
  # minute (DynamoDB fire ledger). Web scales to N. See docs/kestrel/adr/0001.
  mode: quartz
  queueUrl: ""          # SQS FIFO fire queue (KestrelRef output FireQueueUrl)
  ledgerTable: ""       # DynamoDB fire ledger (KestrelRef output FireLedgerTable)
  region: ""
  trigger:
    image: ""           # kestrel-trigger image (repository:tag), built by CI
    arch: ""            # optional node arch for trigger pods; the image is multi-arch

web:
  # Must stay 1 while scheduler.mode=quartz: OSS has no schedule-ownership takeover, so N replicas
  # either double-fire or orphan schedules. The chart refuses replicas > 1 in quartz mode.
  replicas: 1
  # quartz mode only: fixed server UUID (upstream default is a constant shared by every install).
  # kubernetes mode derives one per pod from its StatefulSet name.
  serverUuid: ""
  resources:
    requests: { cpu: "1", memory: 3Gi }
    limits: { memory: 3Gi }
  jvmMaxRamPercentage: 75
  sessionTimeoutSeconds: 3600
  # Upstream rundeck/rundeck images are amd64-only (checked 2026-10-09, tags up to 6.3.0-rc2).
  # Graviton/arm64 arrives with the multi-arch Kestrel image in M1.
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []       # list of EnvVar
  topologySpreadConstraints: []

# Persistence (ADR 0004). dynamodb = every domain class lives in DynamoDB and there is no RDBMS
# (database.* is ignored). Tables are created at startup under tablePrefix (IAM must allow
# <prefix>-*). rdbms = upstream's storage through database.*.
storage:
  mode: rdbms
  dynamodb:
    tablePrefix: ""
    createTables: true

# kubernetes mode: pods that execute scheduled jobs. Same image and settings as web.
runner:
  replicas: 1
  resources:
    requests: { cpu: "1", memory: 3Gi }
    limits: { memory: 3Gi }

serviceAccount:
  create: true
  name: ""
  # IRSA role (eks.amazonaws.com/role-arn). With EKS Pod Identity, leave empty and create a
  # PodIdentityAssociation for this service account in the infra stack instead.
  roleArn: ""

database:
  # storage.mode=rdbms only: JDBC to RDS (upstream's storage). Ignored with storage.mode=dynamodb,
  # where the app has no RDBMS at all (M2d).
  url: ""            # jdbc:postgresql://host:5432/kestrel
  driver: org.postgresql.Driver
  # Secret with keys `username` and `password` (External Secrets / Secrets Store CSI).
  existingSecret: ""

keyStorage:
  # Secret with key `password` used by the aes-gcm storage converters for keys/ and projects/.
  existingSecret: ""

logStorage:
  s3:
    enabled: false
    # kestrel-s3 (bundled): partial checkpoints every checkpointInterval, so any pod can tail a
    # running execution. org.rundeck.amazon-s3 needs the external plugin listed in `plugins`.
    provider: kestrel-s3
    bucket: ""
    region: ""
    checkpointInterval: 5s

# Plugin jars fetched into libext/ by an init container. Each needs a pinned sha256.
# The S3 log store (org.rundeck.amazon-s3, rundeck-plugins/rundeck-s3-log-plugin) is NOT in the
# upstream image and must be listed here when logStorage.s3.enabled=true.
plugins: []
#  - name: rundeck-s3-log-plugin.jar
#    url: https://github.com/rundeck-plugins/rundeck-s3-log-plugin/releases/download/<ver>/<jar>
#    sha256: <hex>
#    provides: org.rundeck.amazon-s3
pluginFetcher:
  image: curlimages/curl:8.16.0

# Sign-in (ADR 0001 §6): oauth2-proxy sidecar in front of Rundeck, which then binds to 127.0.0.1
# so the proxy cannot be bypassed via the pod IP. The proxy strips client-supplied X-Forwarded-*
# identity headers and sets them from the verified ID token; Rundeck preauth trusts only those.
auth:
  enabled: false
  provider: cognito          # cognito | oidc (any OIDC issuer: Entra ID, Okta, Google, Keycloak…)
  issuerUrl: ""              # cognito: https://cognito-idp.<region>.amazonaws.com/<poolId>
  groupsClaim: ""            # default: cognito:groups for cognito, groups for oidc
  allowedGroups: []          # optional: only these IdP groups may sign in
  # Secret keys: client-id, client-secret, cookie-secret (32 random bytes, base64)
  existingSecret: ""
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

service:
  type: ClusterIP
  port: 4440

ingress:
  # Internal ALB (AWS Load Balancer Controller) used as a CloudFront VPC Origin.
  enabled: true
  className: alb
  host: ""           # optional host rule; CloudFront forwards the viewer Host or the origin host
  certificateArn: "" # ACM cert on the ALB for HTTPS between CloudFront and the origin
  # Restrict the ALB to CloudFront VPC-origin traffic via its managed security group.
  securityGroups: ""
  annotations: {}

# Attach pods to an ALB target group owned by infrastructure-as-code (infra/ in this repo) instead
# of letting an Ingress create the ALB. Use with ingress.enabled=false. EKS Auto Mode API group.
targetGroupBinding:
  enabled: false
  targetGroupArn: ""
  apiVersion: eks.amazonaws.com/v1   # elbv2.k8s.aws/v1beta1 with the self-managed LB controller

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
